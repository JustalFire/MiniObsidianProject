<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/reset.css?v=3">
    <link rel="stylesheet" href="css/layout.css?v=3">
    <link rel="stylesheet" href="css/menu.css?v=3">
    <link rel="stylesheet" href="css/note.css?v=3">
    <link rel="stylesheet" href="css/svg.css?v=3">
</head>
<body>

    <div id="canvas-container">
        <svg id="connections-layer"></svg>
        <div id="notes-layer"></div>
    </div>

    <div id="context-menu">
        <div class="menu-item" id="menu-create">Создать заметку</div>
        <div class="menu-item" id="menu-connect">Соединить</div>
        <div class="menu-item" id="menu-edit">Редактировать</div>
        <div class="menu-item" id="menu-delete">Удалить</div>
    </div>

    <div id="view-modal">
        <div class="modal-overlay" id="view-modal-overlay"></div>
        <div class="modal-content">
            <h2 id="view-modal-title"></h2>
            <div id="view-modal-body"></div>
            <div class="modal-buttons">
                <button id="view-modal-close">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="note-modal">
        <div class="modal-overlay" id="edit-modal-overlay"></div>
        <div class="modal-content">
            <h2 id="note-modal-heading">Заметка</h2>
            <input id="modal-title" type="text" placeholder="Заголовок">
            <textarea id="modal-content" placeholder="Содержание"></textarea>
            <input id="modal-color" type="color" value="#dcdcdc">
            <div class="modal-buttons">
                <button id="modal-save">Сохранить</button>
                <button id="modal-cancel">Отмена</button>
            </div>
        </div>
    </div>

    <script src="js/constants.js?v=3"></script>
    <script src="js/state.js?v=3"></script>
    <script src="js/telegramWebApp.js?v=3"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/svgMath.js?v=3"></script>
    <script src="js/modalManager.js?v=3"></script>
    <script src="js/uiRenderer.js?v=3"></script>
    <script src="js/contextMenu.js?v=3"></script>
    <script src="js/dragAndDrop.js?v=3"></script>
    <script src="js/connectionMode.js?v=3"></script>
    <script src="js/app.js?v=3"></script>

</body>
</html>
